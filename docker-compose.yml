version: '3.9'

services:
  app:
    build: .
    container_name: nextjs-app
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/my-database  # MongoDB接続文字列
      - NODE_ENV=production
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"  # ローカルから直接アクセスしたい場合
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data: